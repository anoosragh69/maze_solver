<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Solver Results</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f1a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #00e5ff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            background-color: #141422;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            justify-items: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .gif-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .gif-title {
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffea00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Maze Solver Results</h1>

        <div class="section">
            <h2>Real-Time Animations (GIFs)</h2>
            <div class="image-grid">
                <div class="gif-container">
                    <div class="gif-title">Time Priority (α = 0.0)</div>
                    <img src="maze_solve_a0.0.gif" alt="Animation a=0.0">
                </div>
                <div class="gif-container">
                    <div class="gif-title">Balanced (α = 0.5)</div>
                    <img src="maze_solve_a0.5.gif" alt="Animation a=0.5">
                </div>
                <div class="gif-container">
                    <div class="gif-title">Cost Priority (α = 1.0)</div>
                    <img src="maze_solve_a1.0.gif" alt="Animation a=1.0">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Solution Comparison</h2>
            <img src="solution_comparison.png" alt="Solution Comparison">
        </div>

        <div class="section">
            <h2>GA Convergence</h2>
            <div class="image-grid">
                <img src="convergence_a0.0.png" alt="Convergence a=0.0">
                <img src="convergence_a0.5.png" alt="Convergence a=0.5">
                <img src="convergence_a1.0.png" alt="Convergence a=1.0">
            </div>
        </div>

        <div class="section">
            <h2>Cross-Experiment Analysis</h2>
            <img src="cross_experiment_analysis.png" alt="Cross Experiment Analysis">
        </div>
    </div>
</body>
</html>
